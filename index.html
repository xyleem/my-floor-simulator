<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>木地板模擬器</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <header class="sidebar-header">
        <h3>空間參數設定</h3>
      </header>

      <details class="tool-panel" open>
        <summary>空間與間距</summary>
        <div class="panel-content">
          <div class="input-group">
            <label for="room-length">房間長度 (公分)</label>
            <input type="number" id="room-length" value="600" step="10">
          </div>
          <div class="input-group">
            <label for="room-width">房間寬度 (公分)</label>
            <input type="number" id="room-width" value="400" step="10">
          </div>
          <div class="input-group">
            <label for="wall-thickness">牆壁厚度 (公分)</label>
            <input type="number" id="wall-thickness" value="5" readonly>
          </div>
          <div class="input-group">
            <label>牆邊間距 (公分) (上/下/左/右)</label>
            <div class="grid-inputs">
              <input type="number" id="gap-top" value="1" step="0.5" title="上方間距">
              <input type="number" id="gap-bottom" value="1" step="0.5" title="下方間距">
              <input type="number" id="gap-left" value="1" step="0.5" title="左側間距">
              <input type="number" id="gap-right" value="1" step="0.5" title="右側間距">
            </div>
          </div>
        </div>
      </details>

      <details class="tool-panel" open>
        <summary>地板與鋪法規則</summary>
        <div class="panel-content">
          <div class="input-group">
            <label for="floor-board-length">木地板長度 (公分)</label>
            <input type="number" id="floor-board-length" value="138" step="1">
          </div>
          <div class="input-group">
            <label for="floor-board-width">木地板寬度 (公分)</label>
            <input type="number" id="floor-board-width" value="19.3" step="0.1">
          </div>
          <div class="input-group">
            <label for="planks-per-box">每箱片數</label>
            <input type="number" id="planks-per-box" value="8" step="1" min="1">
          </div>
          <hr style="border-color: #555;">
          <div class="input-group">
              <label>最小起始板長度規則</label>
              <div class="radio-group">
                  <input type="radio" id="start-rule-fixed" name="start-rule" value="fixed" checked>
                  <label for="start-rule-fixed">固定長度 (cm)</label>
                  <input type="number" id="min-start-fixed" value="30" step="1">
              </div>
              <div class="radio-group">
                  <input type="radio" id="start-rule-fraction" name="start-rule" value="fraction">
                  <label for="start-rule-fraction">木板長度 /</label>
                  <input type="number" id="min-start-fraction" value="5" step="1" disabled>
                  <span id="min-start-fraction-result" class="calculated-result"></span>
              </div>
          </div>
          <hr style="border-color: #555;">
          <div class="input-group">
            <label for="min-last-row-width">最小末片板長度 (公分)</label>
            <input type="number" id="min-last-row-width" value="15" step="1">
          </div>
          <div class="input-group">
            <label for="min-sequence-spacing" title="當原始序列中任意相鄰長度的間距小於此值，將觸發奇偶分組以打散序列。">最小序列間距 (公分)</label>
            <input type="number" id="min-sequence-spacing" value="27.6" step="0.1">
          </div>
          
          <hr style="border-color: #555;">
          <div class="input-group">
            <label for="manual-first-row-width">第一排寬度 (公分)</label>
            <input type="number" id="manual-first-row-width" step="0.1" placeholder="預設為木地板寬度" min="0">
          </div>
        </div>
      </details>
      
      <details class="tool-panel" open>
        <summary>鋪設方案</summary>
        <div class="panel-content">
            <div class="input-group">
                <label for="layout-pattern-container">選擇方案 (可直接點擊複選)</label>
                <div id="layout-pattern-container" class="pattern-selector">
                    <div class="pattern-option" data-value="custom">自訂交錯</div>
                    <div class="pattern-option selected" data-value="2">1/2 交錯 (2階)</div>
                    <div class="pattern-option" data-value="3">1/3 交錯 (3階)</div>
                    <div class="pattern-option" data-value="4">1/4 交錯 (4階)</div>
                    <div class="pattern-option" data-value="5">1/5 交錯 (5階)</div>
                    <div class="pattern-option" data-value="6">1/6 交錯 (6階)</div>
                    <div class="pattern-option" data-value="7">1/7 交錯 (7階)</div>
                    <div class="pattern-option" data-value="8">1/8 交錯 (8階)</div>
                    <div class="pattern-option" data-value="9">1/9 交錯 (9階)</div>
                    <div class="pattern-option" data-value="10">1/10 交錯 (10階)</div>
                    <div class="pattern-option" data-value="11">1/11 交錯 (11階)</div>
                    <div class="pattern-option" data-value="12">1/12 交錯 (12階)</div>
                    <div class="pattern-option" data-value="13">1/13 交錯 (13階)</div>
                </div>
            </div>
        </div>
      </details>

    </aside>
    
    <main class="main-content">
      <div class="viewport-container">
        <div id="viewport-2d" class="viewport">
          <div class="viewport-label">2D 平面配置</div>
          <canvas id="canvas-2d"></canvas>
        </div>
      </div>
      <aside id="details-panel" class="details-panel"></aside>
    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
